<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V Power</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:linear-gradient(160deg,#0A0A1A,#050508); color:#fff;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { width:min(92vw,420px); padding:32px 28px; text-align:center; }
  h1 { margin:0; font-size:34px; font-weight:900; letter-spacing:8px; }
  .sub { color:#F2362E; font-weight:800; font-size:13px; letter-spacing:1.5px; }
  .sub span { color:#9a9a9a; font-weight:500; letter-spacing:0; }
  dl { margin:28px 0; border:1px solid #2E2E2E; border-radius:12px;
       background:#171717; padding:4px 18px; text-align:left; }
  dt { color:#8c8c8c; font-size:12px; margin-top:14px; }
  dd { margin:2px 0 14px; font-size:17px; font-weight:600;
       font-variant-numeric:tabular-nums; color:#00BFFF; word-break:break-all; }
  p { color:#9a9a9a; font-size:14px; }
  .hint { border-top:1px solid #2E2E2E; padding-top:20px; margin-top:24px; }
  code { background:#171717; border:1px solid #2E2E2E; border-radius:6px;
         padding:2px 6px; font-size:13px; color:#ccc; }
</style>
</head>
<body>
<div class="card">
  <h1>VORTEC</h1>
  <div class="sub">V POWER <span>飛輪功率儀錶板</span></div>

  <dl>
    <dt>曲柄藍牙名稱</dt><dd id="ble">—</dd>
    <dt>車台識別名稱</dt><dd id="id">—</dd>
  </dl>

  <p id="msg">每台飛輪車貼一張 QR Code，掃描後自動開啟 App、連上該車曲柄，並設定廣播識別名稱。</p>

  <div class="hint">
    <p>看到這個網頁，代表這支手機還沒安裝 V Power，或尚未完成連結驗證。<br>
       安裝後再掃一次這張 QR Code 即可。</p>
    <p>也可以在 App 裡手動選擇名稱為 <code id="ble2">—</code> 的裝置。</p>
  </div>
</div>
<script>
  // Shows what the sticker encodes, so a failed hand-off is still diagnosable.
  var q = new URLSearchParams(location.search);
  var ble = q.get("ble"), id = q.get("id") || ble;
  if (ble) {
    document.getElementById("ble").textContent = ble;
    document.getElementById("ble2").textContent = ble;
    document.getElementById("id").textContent = id;
  } else {
    document.getElementById("msg").textContent =
      "這個連結沒有帶車台資訊（缺少 ble 參數）。";
  }
</script>
</body>
</html>
